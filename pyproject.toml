[project]
name = "dino-rl"
version = "0.2.0"
description = "Learn Chrome's built-in Dino game with a local, CPU-limited DQN agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "gymnasium>=1.0,<2",
  "numpy>=1.26,<3",
  "playwright>=1.50,<2",
  "psutil>=6,<8",
  "stable-baselines3>=2.9.2,<3",
  "tensorboard>=2.18,<3",
  "torch>=2.3,<3",
]

[project.scripts]
dino = "dino_rl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"dino_rl/__main__.py" = ["E402"]
