<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dino RL</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <h1>Dino RL</h1>
    <p id="status" role="status">Checking the game…</p>
    <button id="open" type="button">Open Dino &amp; play</button>
    <button id="disconnect" type="button" disabled>Disconnect</button>
    <p class="note">Your input pauses the model. Use Resume inside the game to continue.</p>
    <p class="note">Chrome’s native offline game · local DQN · no server</p>
  </body>
</html>
